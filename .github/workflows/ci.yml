name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tourguard
          POSTGRES_USER: tourguard
          POSTGRES_PASSWORD: tourguard-ci-password
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U tourguard -d tourguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tourguard:tourguard-ci-password@localhost:5435/tourguard
      SESSION_SECRET: ci-only-session-secret
      NODE_ENV: test
      PORT: 3001
      WEB_ORIGIN: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: npm test --workspace=@tourguard/api
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - run: npm audit --audit-level=high
